// Browser build of the unmodified game code, via gdx-teavm (Java -> JavaScript).
plugins {
    id 'java'
    id 'com.github.xpenatan.gdx-teavm' version '1.6.2'
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = JavaVersion.VERSION_17 // the TeaVM backend needs 17; game modules stay on 11

dependencies {
    implementation project(':core')
    implementation project(':services:updates:debugUpdates')
    implementation project(':services:news:debugNews')
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.github.xpenatan.gdx-teavm:gdx-freetype-web:1.6.2"
    implementation "com.github.xpenatan.gdx-teavm:gdx-controllers-web:1.6.2"
}

gdxTeaVM {
    assets(new File(project(':core').projectDir, 'src/main/assets'))
    assets(new File(project(':desktop').projectDir, 'src/main/assets/fonts').parentFile) // droid_sans.ttf fallback font lives with desktop
    // saves restore objects by class name, so every game class must stay findable by name
    // shortcut: no reflection rules yet. The catch-all pattern below runs TeaVM out of memory (8 GB+), so saving/loading
    // (classes restored by name) is untested. Next step: a targeted list of the classes saves actually store.
    // reflection('com.shatteredpixel.shatteredpixeldungeon.**', 'com.watabou.**')
    webDefaults {
        mainClass = 'com.shatteredpixel.shatteredpixeldungeon.teavm.WebLauncher'
        htmlTitle = '3D PD'
        obfuscated = false  // readable stack traces while porting
    }
    js {
        outOfProcess = true  // SPD is big; TeaVM needs more heap than the Gradle daemon has
        processMemory = 8192
    }
}

// TeaVM can't construct arbitrary classes by name, which saves need (Bundle restores objects by class name).
// This generates a plain factory, class name -> `new X()`, for every public game class with a public no-arg
// constructor. Classes it can't reach (non-public) still go through reflection and are listed in factory-skipped.txt.
def factoryDir = layout.buildDirectory.dir('generated/sources/factory/java')
def factoryRoots = files(project(':core').sourceSets.main.output.classesDirs, project(':SPD-classes').sourceSets.main.output.classesDirs)
def factoryClasspath = files(factoryRoots, configurations.runtimeClasspath) // this module's classpath already holds the game code, libGDX and org.json

tasks.register('generateFactory') {
    dependsOn ':core:classes', ':SPD-classes:classes'
    inputs.files(factoryRoots)
    outputs.dir(factoryDir)
    doLast {
        def loader = new URLClassLoader(factoryClasspath.files.collect { it.toURI().toURL() } as URL[], ClassLoader.platformClassLoader)
        def made = [], skipped = []
        factoryRoots.files.each { root ->
            root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (!f.name.endsWith('.class') || f.name == 'module-info.class') return
                def name = root.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, (char) '.').replaceAll(/\.class$/, '')
                try {
                def c = Class.forName(name, false, loader)
                int m = c.getModifiers() // explicit calls: Groovy's c.modifiers would read a game class's own static field
                if (c.isInterface() || c.isEnum() || c.isAnnotation() || c.isAnonymousClass() || c.isLocalClass() || c.isSynthetic()) return
                if (java.lang.reflect.Modifier.isAbstract(m)) return
                def ctor = c.getDeclaredConstructors().find { it.getParameterCount() == 0 }
                if (ctor == null) return  // never restored by name either
                boolean reachable = java.lang.reflect.Modifier.isPublic(m)
                for (def e = c; e.getEnclosingClass() != null; e = e.getEnclosingClass()) {
                    reachable &= java.lang.reflect.Modifier.isStatic(e.getModifiers()) && java.lang.reflect.Modifier.isPublic(e.getEnclosingClass().getModifiers()) && java.lang.reflect.Modifier.isPublic(e.getModifiers())
                }
                reachable &= java.lang.reflect.Modifier.isPublic(ctor.getModifiers())
                if (reachable) made << [name, c.getCanonicalName()] else skipped << name
                } catch (Throwable t) { skipped << "$name (cannot inspect: $t)" }
            }
        }
        made.sort { it[0] }
        def chunks = made.collate(200)
        def out = new StringBuilder()
        out << "package com.shatteredpixel.shatteredpixeldungeon.teavm;\n\n"
        out << "// Generated by teavm/build.gradle (generateFactory). Do not edit.\n"
        out << "final class GeneratedFactory implements java.util.function.Function<String, Object> {\n\n"
        out << "\t@Override\n\tpublic Object apply(String n) {\n\t\tObject o;\n"
        chunks.eachWithIndex { ch, i -> out << "\t\tif ((o = f${i}(n)) != null) return o;\n" }
        out << "\t\treturn null;\n\t}\n"
        chunks.eachWithIndex { ch, i ->
            out << "\n\tprivate static Object f${i}(String n) {\n\t\tswitch (n) {\n"
            ch.each { out << "\t\t\tcase \"${it[0]}\": return new ${it[1]}();\n" }
            out << "\t\t\tdefault: return null;\n\t\t}\n\t}\n"
        }
        out << "}\n"
        def dir = factoryDir.get().dir('com/shatteredpixel/shatteredpixeldungeon/teavm').asFile
        dir.mkdirs()
        new File(dir, 'GeneratedFactory.java').text = out.toString()
        new File(factoryDir.get().asFile.parentFile, 'factory-skipped.txt').text = skipped.sort().join('\n') + '\n'
        logger.lifecycle("generateFactory: ${made.size()} classes in the factory, ${skipped.size()} left to reflection (see factory-skipped.txt)")
    }
}
sourceSets.main.java.srcDir(factoryDir)
compileJava.dependsOn 'generateFactory'
